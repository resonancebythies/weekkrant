<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="De Weekkrant">
  <!-- Krantenkop-achtergrond -->
  <rect width="200" height="60" fill="#0d1b2a"/>
  <!-- Rode accentlijn -->
  <rect y="54" width="200" height="6" fill="#8b1a1a"/>
  <!-- Tekst: DW in klassiek serif-stijl -->
  <text x="12" y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-1">DW</text>
  <!-- Subtitel -->
  <text x="80" y="28"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="9"
    fill="#c8bfa8"
    letter-spacing="1">DE</text>
  <text x="80" y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="700"
    fill="#e8e0d0"
    letter-spacing="0.5">WEEKKRANT</text>
</svg>
